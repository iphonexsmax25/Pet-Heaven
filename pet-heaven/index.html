<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pet Heaven helps you adopt a dog or cat in Singapore, or find a loving new home for a pet you can no longer keep." />
    <meta name="theme-color" content="#c93f06" />
    <script>
      // Runs before React and sets data-theme so the page never flashes the wrong colours.
      // Same logic as ThemeContext: a saved "light" or "dark" wins; otherwise follow the device once.
      // The detected device theme is never saved. Only the toggle button saves a choice.
      (function () {
        var theme = null;
        try {
          var saved = window.localStorage.getItem('petHeavenTheme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch (error) { /* storage blocked: use the device theme */ }
        if (!theme) {
          theme = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#17120f' : '#c93f06');
      })();
    </script>
    <style>
      /* Background shown before the main stylesheet loads (matches --color-bg in each theme). */
      html { background: #fffaf3; }
      html[data-theme="dark"] { background: #17120f; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet" />
    <title>Pet Heaven | Pet Adoption in Singapore</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
